management.endpoints.web.exposure.include=health,info,metrics

#Configuration dynamique
spring.cloud.gateway.server.webmvc.routes[0].id=CANDIDAT
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://candidat
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/candidat/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=CANDIDATURE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://candidature
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/candidature/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.loadbalancer=TRACE
